<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factor Quest</title>
<style>
:root{--bg:#fff8e8;--fg:#1d2a3a;--pri:#2f5d9e;--pt:#fff;--card:#fff;--ok:#2e7d32;--bad:#c62828;--sel:#dbe8ff;--okbg:#dff3e0;--badbg:#fde3e3}
@media(prefers-color-scheme:dark){:root{--bg:#161b24;--fg:#eef1f6;--pri:#7fb0ff;--pt:#10161f;--card:#222a37;--ok:#7ddc8a;--bad:#ff8f8f;--sel:#2c4263;--okbg:#1f3a27;--badbg:#472626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,"Segoe UI",Arial,sans-serif;text-align:center;padding:0;height:100%;overflow:hidden}
html{height:100%}
#wrap{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#app{height:100%;display:flex;flex-direction:column;justify-content:center}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;padding:12px 24px;transform-origin:0 0;overflow:hidden}
h1{font-size:34px;margin:8px 0 2px}
h2{font-size:22px;margin:4px 0 6px}
.sub{opacity:.85;margin:0 0 12px}
button{font:inherit;cursor:pointer;border:2px solid var(--pri);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 16px;margin:4px;transition:transform .1s}
button:hover{transform:translateY(-2px)}
button.p{background:var(--pri);color:var(--pt);font-weight:700}
button:disabled{opacity:.45;cursor:default;transform:none}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:12px 0}
.lvb{padding:16px 12px;border-width:3px;border-radius:18px;margin:0}
.lvb i{display:block;font-style:normal;font-size:44px}
.lvb b{display:block;font-size:21px}.lvb small{display:block;opacity:.85;font-size:15px}.lvb em{display:block;font-style:normal;margin-top:6px;font-size:15px;color:var(--pri);font-weight:700}
.top{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.top span{background:var(--card);border:2px solid var(--pri);border-radius:999px;padding:2px 14px;font-size:16px}
.top button{padding:2px 12px;margin:0;font-size:15px}
.eq{font-size:clamp(34px,5.6vw,56px);font-weight:800;margin:4px 0;color:var(--pri);letter-spacing:1px}
.trk{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.trk span{padding:3px 14px;border-radius:999px;border:2px solid var(--bd,#b9c6dd);font-size:15px;opacity:.6}
.trk .on{opacity:1;background:var(--pri);color:var(--pt);border-color:var(--pri);font-weight:700}
.trk .dn{opacity:1;background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.panel{background:var(--card);border:3px solid var(--pri);border-radius:18px;padding:12px 16px;min-height:360px}
.panel p{margin:4px 0 8px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.tile{font-size:28px;font-weight:700;min-width:70px;min-height:58px;margin:0}
.tile.sel{background:var(--sel);border-color:var(--pri);box-shadow:0 0 0 3px var(--pri) inset}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px auto;max-width:820px}
.opt{font-size:28px;font-weight:700;min-height:64px;margin:0}
.slots{display:flex;align-items:center;justify-content:center;gap:12px;font-size:30px;font-weight:800;margin:8px 0}
.slot{min-width:78px;height:64px;border:3px dashed var(--pri);border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--sel)}
.meter{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;font-size:20px}
.meter div{border:2px solid var(--pri);border-radius:12px;padding:4px 14px;min-width:240px}
.meter .m-ok{background:var(--okbg);border-color:var(--ok)}.meter .m-bad{background:var(--badbg);border-color:var(--bad)}
.br{font-size:34px;font-weight:800;margin:6px 0;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.br button{padding:0 12px;margin:0 2px;font-size:26px;min-height:46px}
.zp{font-size:26px;font-weight:700;margin:6px 0}
.fb{min-height:48px;margin:8px 0;font-size:19px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.pop{animation:pp .5s}@keyframes pp{40%{transform:scale(1.04)}}
.ver{font-size:20px;margin:6px 0;text-align:left;display:inline-block}
.stars{font-size:60px;margin:6px}
.foot{opacity:.8;margin-top:16px}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:690px;padding:10px}
.logo{width:150px;border-radius:30px;box-shadow:0 12px 30px #0004;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.cover h1{font-size:clamp(36px,7vw,60px);margin:6px 0 0}
.cover .tag{font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--pri)}
.cover .tag2{max-width:620px;opacity:.9}
.go{font-size:26px;font-weight:700;background:var(--pri);color:var(--pt);border:0;border-radius:16px;padding:14px 40px;margin-top:10px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.tp{display:inline-block;background:var(--card);border:3px solid var(--pri);border-radius:18px;padding:16px 22px;margin:10px}
.big{font-size:46px;font-weight:800;color:var(--pri)}
</style></head><body><div id="wrap"><div id="stage"><div id="app"></div></div></div>

let HT=0,PICK=0;
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const N=v=>v<0?'−'+Math.abs(v):String(v);
const lab=s=>s<60?s+' sec':(s/60)+' min';
const mmss=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
function frac(n,d){const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}const s=(n<0?'−':'')+Math.abs(n);return d==1?s:s+'/'+d}
function poly(a,b,c){let s=(a==1?'':a)+'x²';if(b)s+=' '+(b<0?'−':'+')+' '+(Math.abs(b)==1?'':Math.abs(b))+'x';if(c)s+=' '+(c<0?'−':'+')+' '+Math.abs(c);return s}
function lin(a,p){return (a==1?'':a)+'x'+(p?' '+(p<0?'−':'+')+' '+Math.abs(p):'')}
function facStr(x,y){if(y==0&&x!=0){const t=x;x=y;y=t}return x==0?'x('+lin(1,y)+')':'('+lin(1,x)+')('+lin(1,y)+')'}
const LV=[['🌱','Level 1 · Warm-up','x² + bx + c with positive numbers'],['🌿','Level 2 · Mixed signs','Positive and negative numbers'],['🌳','Level 3 · Special cases','Difference of squares, perfect squares, common factor x'],['🚀','Level 4 · Challenge','ax² + bx + c where a is 2 or 3']];
const BK='aral-factor-quest-best';
function best(){try{return JSON.parse(localStorage.getItem(BK)||'{}')}catch(e){return{}}}
function saveBest(l,v,t){try{const b=best(),k=l+'_'+t;if(!b[k]||v>b[k]){b[k]=v;localStorage.setItem(BK,JSON.stringify(b))}}catch(e){}}
function bestOf(l){const b=best();let m=0;for(const k in b)if(k.split('_')[0]==l&&b[k]>m)m=b[k];return m}
function resetBest(l){if(!confirm('Reset the best scores for this level?'))return;try{const b=best();for(const k in b)if(k.split('_')[0]==l)delete b[k];localStorage.setItem(BK,JSON.stringify(b))}catch(e){}askT(l)}

/* ---------- problems ---------- */
function mk(m,n,type){const b=m+n,c=m*n,rn=[[-m,1],[-n,1]];return fin2({a:1,b,c,m,n,type,rn,steps:['pair','factor','roots'],final:facStr(m,n)})}
function fin2(p){const seen={};p.rn=p.rn.filter(r=>{const k=frac(r[0],r[1]);if(seen[k])return false;seen[k]=1;return true});p.roots=p.rn.map(r=>frac(r[0],r[1]));p.eq=poly(p.a,p.b,p.c);return p}
function gen(l,n){n=n||0;const sg=()=>R(0,1)?1:-1;
 if(l==3){const A=n>=8?5:n>=3?4:3,Q=Math.min(7+Math.floor(n/2),13);
  for(;;){const a=R(2,A),p=R(-Q,Q),q=R(-Q,Q);if(!p||!q||p%a==0||p==a*q)continue;const b=a*q+p,c=p*q;if(!b||gcd(gcd(a,b),c)!=1)continue;
   return fin2({a,b,c,p,q,rn:[[-p,a],[-q,1]],steps:['build','roots'],final:'('+lin(a,p)+')('+lin(1,q)+')'})}}
 const M=Math.min((l==0?9:9)+Math.floor(n/2),l==0?15:25);
 if(l==2){const t=R(0,3),K=Math.min(12+Math.floor(n/2),25);
  if(t==0){const k=R(2,K);const p=mk(k,-k);p.tip='Difference of squares: x² − k² = (x + k)(x − k).';return p}
  if(t==1){const m=R(2,K)*sg();const p=mk(0,m);p.tip='Every term has an x — you can factor x out first.';return p}
  if(t==2){const k=R(2,Math.min(9+Math.floor(n/2),18))*sg();const p=mk(k,k);p.tip='Perfect square: both brackets are the same.';return p}}
 for(;;){let m,n2;if(l==0){m=R(1,M);n2=R(1,M)}else{m=R(-M,M);n2=R(-M,M);if(m>0&&n2>0)continue}
  if(!m||!n2||m==n2)continue;return mk(m,n2)}
}

/* ---------- step data ---------- */
function pairTiles(p){const req=[p.m,p.n],o=new Set(),ac=Math.abs(p.c);
 for(let d=1;d<=Math.min(ac,20);d++)if(ac%d==0){o.add(d);o.add(-d)}o.add(-p.m);o.add(-p.n);
 const lim=Math.max(9,Math.abs(p.m),Math.abs(p.n));
 let oth=shuf([...o].filter(v=>v!==p.m&&v!==p.n&&v!==0)).slice(0,8);
 while(oth.length<8){const v=R(-lim,lim);if(v&&v!==p.m&&v!==p.n&&!oth.includes(v))oth.push(v)}
 return shuf(req.concat(oth))}
function facOpts(p){const key=(x,y)=>[x,y].sort((a,b)=>a-b).join(','),m=p.m,n=p.n,seen=new Set(),out=[];
 [[m,n],[-m,-n],[m,-n],[-m,n],[m,n+1],[m+1,n],[m-1,n]].forEach(([x,y])=>{const k=key(x,y);if(!seen.has(k)&&out.length<4){seen.add(k);out.push({x,y,ok:out.length==0})}});
 return shuf(out)}
function rootOpts(p){const cor=p.roots,set=new Set(),wrong=[];
 if(p.a==1){wrong.push(frac(p.m,1),frac(p.n,1))}else{wrong.push(frac(p.p,p.a),frac(p.q,1),frac(-p.p,1),frac(p.p,1))}
 const w=[...new Set(wrong)].filter(v=>!cor.includes(v));
 const out=cor.slice();shuf(w).forEach(v=>{if(out.length<6)out.push(v)});
 while(out.length<6){const v=frac(R(-9,9),1);if(!out.includes(v))out.push(v)}
 return shuf(out)}

 '</div><p>or type minutes: <input id="cm" type="number" min="1" max="60" style="width:80px;font:inherit;padding:6px"> <button class="p" onclick="cust()">▶ Start</button></p></div><p>'+(bestOf(l)?'🏆 Best score: <b>'+bestOf(l)+'</b>':'No score yet')+'</p><div><button onclick="menu()">⬅ Back to levels</button><button onclick="resetBest('+l+')">🗑 Reset best score</button><button onclick="cover()">🏠 Front page</button></div>'}

function newP(){let p;for(let k=0;k<200;k++){p=gen(S.l,S.solved);if(!S.P.slice(-40).some(q=>q.eq==p.eq))break}return p}
function start(l){S={l,P:[],i:0,si:0,score:0,streak:0,good:0,tw:0,pbad:0,fin:false,T:HT,t:HT,solved:0};S.P.push(newP());initStep();
 clearInterval(TI);if(S.T)TI=setInterval(tick,1000);render()}
function tick(){if(!S)return;S.t--;const e=$('#tm');if(e)e.textContent='⏱ '+mmss(Math.max(0,S.t));if(S.t<=0)finish(true)}
function initStep(){const p=S.P[S.i],st=p.steps[S.si];S.sel=[];S.rs=[];S.stw=0;S.sth=0;S.fb='';
 if(st=='pair')S.tiles=pairTiles(p);if(st=='factor')S.fo=facOpts(p);if(st=='roots')S.ro=rootOpts(p);if(st=='build'){S.bp=1;S.bq=1}}

const PRAISE=['Well done! 👏','Great job! 🎉','Correct! ✅','Excellent! ⭐','Awesome! 🌟'];
function good(){const p=S.P[S.i];S.score+=Math.max(2,10-3*S.stw-(S.sth?3:0));S.good++;
 if(S.si<p.steps.length-1){S.si++;initStep();S.fb='<span class="ok">'+PRAISE[R(0,4)]+'</span>';render();const e=$('.panel');if(e)e.classList.add('pop')}
 else{S.solved++;if(!S.pbad){S.streak++;S.score+=Math.min(10,2*S.streak)}else S.streak=0;S.fin=true;S.fb='';render();const e=$('.panel');if(e)e.classList.add('pop')}}

function pickT(k){if(S.sel.includes(k))S.sel=S.sel.filter(x=>x!==k);else if(S.sel.length<2)S.sel.push(k);S.fb='';render()}
function chkPair(){const p=S.P[S.i];if(S.sel.length<2){S.fb='Pick two numbers first.';render();return}
 const a=S.tiles[S.sel[0]],b=S.tiles[S.sel[1]];
 if(a*b==p.c&&a+b==p.b)good();
 else{const pm=a*b==p.c,sm=a+b==p.b;bad(pm?'The product is right, but the sum is '+N(a+b)+' — we need '+N(p.b)+'.':sm?'The sum is right, but the product is '+N(a*b)+' — we need '+N(p.c)+'.':'Not yet: '+N(a)+' × '+N(b)+' = '+N(a*b)+' and '+N(a)+' + '+N(b)+' = '+N(a+b)+'. We need product '+N(p.c)+' and sum '+N(p.b)+'.')}}
function pickF(k){const o=S.fo[k],p=S.P[S.i];if(o.ok){good();return}
 bad('Expand it: '+facStr(o.x,o.y)+' = '+poly(1,o.x+o.y,o.x*o.y)+' — that is not '+p.eq+'.')}
function pickR(k){const v=S.ro[k];if(S.rs.includes(v))S.rs=S.rs.filter(x=>x!==v);else S.rs.push(v);S.fb='';render()}
function chkR(){const p=S.P[S.i];if(!S.rs.length){S.fb='Pick at least one value of x.';render();return}
 const ok=S.rs.length==p.roots.length&&p.roots.every(r=>S.rs.includes(r));
 if(ok)good();else if(S.rs.some(r=>!p.roots.includes(r)))bad('Careful with signs: if x + 3 = 0, then x = −3 (move the 3 to the other side).');
 else bad('You are missing a solution — each bracket gives its own value of x.')}
function adj(w,d){if(w=='p')S.bp=Math.max(-9,Math.min(9,S.bp+d));else S.bq=Math.max(-9,Math.min(9,S.bq+d));S.fb='';render()}
function chkB(){const p=S.P[S.i],B=p.a*S.bq+S.bp,C=S.bp*S.bq;
 if(B==p.b&&C==p.c)good();else bad('It expands to '+poly(p.a,B,C)+' — compare the middle and last terms with '+p.eq+'.')}
function hint(){const p=S.P[S.i],st=p.steps[S.si];S.sth=1;let h;
 if(st=='pair')h=p.c==0?'The product is 0, so one of the numbers must be 0.':p.c>0?'Product is positive → both numbers have the same sign (the sign of '+N(p.b)+'). List the factor pairs of '+Math.abs(p.c)+'.':'Product is negative → one number is positive, one is negative. The bigger one takes the sign of '+N(p.b)+'.';
 else if(st=='factor')h='Expand each choice with FOIL. The right one gives '+p.eq+'.';
 else if(st=='roots')h='Zero-product rule: if A × B = 0 then A = 0 or B = 0. Set each bracket equal to 0 and solve.';
 else h=p.tip||'p × q must equal '+p.c+'. Then check that '+p.a+'q + p gives the middle number '+N(p.b)+'.';
 if(p.tip&&st!='build'&&st!='roots')h+=' ('+p.tip+')';S.fb='💡 '+h;render()}

  '<div class="slots"><div class="slot">'+(t[0]!==undefined?N(t[0]):'?')+'</div>×<div class="slot">'+(t[1]!==undefined?N(t[1]):'?')+'</div></div>'+
  '<div class="meter"><div>Product: <b>'+(two?N(t[0]*t[1]):'?')+'</b> (need '+N(p.c)+')</div><div>Sum: <b>'+(two?N(t[0]+t[1]):'?')+'</b> (need '+N(p.b)+')</div></div>'+
  '<div class="tiles">'+S.tiles.map((v,k)=>'<button class="tile'+(S.sel.includes(k)?' sel':'')+'" onclick="pickT('+k+')">'+N(v)+'</button>').join('')+'</div>'+
  '<button class="p" onclick="chkPair()">✔ Check my pair</button><button onclick="hint()">💡 Hint</button>'}
 else if(st=='factor'){h='<h2>Step 2 · Write the factors</h2><p>Use your pair to write <b>'+p.eq+'</b> as two brackets multiplied together. Which one is correct?</p><div class="opts">'+
  S.fo.map((o,k)=>'<button class="opt" onclick="pickF('+k+')">'+facStr(o.x,o.y)+' = 0</button>').join('')+'</div><button onclick="hint()">💡 Hint</button>'}
 else if(st=='build'){const B=p.a*S.bq+S.bp,C=S.bp*S.bq,mo=B==p.b,co=C==p.c;
  h='<h2>Step 1 · Build the factors</h2><p>Change the numbers in the brackets until the product matches <b>'+p.eq+'</b>.</p>'+
  '<div class="br">( '+(p.a)+'x <button onclick="adj(\'p\',-1)">−</button><b>'+N(S.bp)+'</b><button onclick="adj(\'p\',1)">+</button> ) ( x <button onclick="adj(\'q\',-1)">−</button><b>'+N(S.bq)+'</b><button onclick="adj(\'q\',1)">+</button> )</div>'+
  '<p>Expands to: <b>'+poly(p.a,B,C)+'</b></p><div class="meter"><div class="'+(mo?'m-ok':'m-bad')+'">Middle term: '+N(B)+'x '+(mo?'✓':'✗ need '+N(p.b)+'x')+'</div><div class="'+(co?'m-ok':'m-bad')+'">Last term: '+N(C)+' '+(co?'✓':'✗ need '+N(p.c))+'</div></div>'+
  '<div style="margin-top:10px"><button class="p" onclick="chkB()">✔ Lock it in</button><button onclick="hint()">💡 Hint</button></div>'}
 else{const f=p.a==1?[lin(1,p.m),lin(1,p.n)]:[lin(p.a,p.p),lin(1,p.q)],n=p.steps.length;
  h='<h2>Step '+n+' · Solve for x</h2><div class="zp">'+(p.a==1?p.final:p.final)+' = 0</div><p>Zero-product rule: <b>'+f[0]+' = 0</b> or <b>'+f[1]+' = 0</b>. Tap <b>every</b> value of x that works.</p>'+
  '<div class="tiles">'+S.ro.map((v,k)=>'<button class="tile'+(S.rs.includes(v)?' sel':'')+'" onclick="pickR('+k+')">x = '+v+'</button>').join('')+'</div><button class="p" onclick="chkR()">✔ Check my answer</button><button onclick="hint()">💡 Hint</button>'}
 return h}
function render(){const p=S.P[S.i],st=p.steps[S.si];
 let h='<div class="top"><span>'+LV[S.l][1]+'</span><span>Problem '+(S.i+1)+'</span><span>⭐ '+S.score+'</span><span>🔥 '+S.streak+'</span>'+(S.T?'<span id="tm">⏱ '+mmss(Math.max(0,S.t))+'</span>':'')+'<button onclick="goBack()">⬅ Back</button></div>';
 h+='<div class="eq">'+p.eq+' = 0</div><div class="trk">'+p.steps.map((s,k)=>'<span class="'+(S.fin||k<S.si?'dn':k==S.si?'on':'')+'">'+(S.fin||k<S.si?'✓ ':'')+(k+1)+' · '+SN[s]+'</span>').join('')+'</div>';
 h+='<div class="panel">'+stepHTML(p,st)+'</div><div class="fb">'+S.fb+'</div>';
 $('#app').innerHTML=h}
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);$('#stage').style.transform='scale('+k+') translate(-50%,-50%)'}
addEventListener('resize',fit);fit();
cover();
</script></body></html>
